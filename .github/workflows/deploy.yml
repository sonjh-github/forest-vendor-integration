name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: forest-vendor-integration-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker build -f dockerfile -t forest-vendor-integration:verify .

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/server/forest-vendor-integration

            git fetch origin main
            git reset --hard origin/main

            # .env가 없으면 배포 중단
            test -f .env

            # core와 통신하는 공용 사설 네트워크
            docker network inspect forest-backend >/dev/null 2>&1 || \
              docker network create forest-backend

            docker build \
              -f dockerfile \
              -t forest-vendor-integration .

            mkdir -p /home/ubuntu/server/forest-vendor-integration/data
            sudo chown 1000:1000 /home/ubuntu/server/forest-vendor-integration/data

            docker rm -f forest-vendor-integration || true

            # Clear only the disabled Excel forwarding queue after its worker stops.
            python3 - <<'PY'
            import pathlib, sqlite3
            path = pathlib.Path('/home/ubuntu/server/forest-vendor-integration/data/log-queue.sqlite')
            if path.is_file():
                with sqlite3.connect(path, timeout=10) as db:
                    exists = db.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='pending_log'").fetchone()
                    if exists:
                        deleted = db.execute('DELETE FROM pending_log').rowcount
                        db.commit()
                        remaining = db.execute('SELECT COUNT(*) FROM pending_log').fetchone()[0]
                        assert remaining == 0
                        print(f'Excel queue cleared: deleted={deleted}, remaining={remaining}')
            else:
                print('Excel queue absent; forwarding disabled')
            PY

            docker run -d \
              --name forest-vendor-integration \
              --restart unless-stopped \
              --network forest-backend \
              --log-opt max-size=10m \
              --log-opt max-file=5 \
              --env-file /home/ubuntu/server/forest-vendor-integration/.env \
              -e CORE_SERVER_URL=http://forest-core-server:18020 \
              -v /home/ubuntu/server/forest-vendor-integration/data:/app/data \
              -p 127.0.0.1:18010:18010 \
              forest-vendor-integration

            docker ps \
              --filter "name=forest-vendor-integration"

            for attempt in $(seq 1 20); do
              status=$(docker inspect --format='{{.State.Health.Status}}' forest-vendor-integration)
              test "$status" = healthy && exit 0
              test "$status" = unhealthy && docker logs --tail 100 forest-vendor-integration && exit 1
              sleep 3
            done

            docker logs --tail 100 forest-vendor-integration
            exit 1
