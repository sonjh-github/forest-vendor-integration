openapi: 3.1.0
info:
  title: 산림청 장비 연동 공통 API
  version: 1.1.0
  description: 모든 장비 업체가 동일한 /{vendor} 경로와 공통 메시지 구조를 사용한다.
servers:
  - url: https://device.forest.tobeunicorn.kr
paths:
  /{vendor}/register:
    parameters:
      - $ref: '#/components/parameters/Vendor'
    post:
      summary: 장비 UUID 매핑 확인 및 캐시 적재
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '200':
          description: 전체 장비 매핑 완료
          content: {application/json: {schema: {$ref: '#/components/schemas/RegisterResponse'}}}
        '207':
          description: 일부 또는 전체 장비 미매핑
          content: {application/json: {schema: {$ref: '#/components/schemas/RegisterResponse'}}}
        '400': {$ref: '#/components/responses/Error'}
  /{vendor}/invoke:
    parameters:
      - $ref: '#/components/parameters/Vendor'
    post:
      summary: 장비 데이터와 통신 경로 보고
      parameters:
        - $ref: '#/components/parameters/Mode'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvokeRequest'}
      responses:
        '200':
          description: 검증 또는 저장 완료
          content: {application/json: {schema: {$ref: '#/components/schemas/InvokeResponse'}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
        '504': {$ref: '#/components/responses/Error'}
  /{vendor}/health:
    parameters:
      - $ref: '#/components/parameters/Vendor'
    get:
      summary: 업체 수신·매핑 상태 확인
      responses:
        '200':
          description: 상태 조회 성공
          content: {application/json: {schema: {type: object, additionalProperties: true}}}
        '400': {$ref: '#/components/responses/Error'}
components:
  parameters:
    Vendor:
      name: vendor
      in: path
      required: true
      description: 발급받은 업체 코드의 소문자 값
      schema: {type: string, enum: [ndps, jininfra]}
    Mode:
      name: mode
      in: query
      required: false
      schema: {type: string, enum: [VALIDATE_ONLY, DELIVER], default: DELIVER}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, format: uuid}
  schemas:
    RegisterRequest:
      type: object
      required: [sourceDeviceId, observedAt, devices]
      properties:
        vendor: {type: string, description: 기존 연동 호환용 선택 필드}
        sourceDeviceId: {type: string, description: 등록 요청의 기준 장비번호이며 devices에 포함되어야 함}
        reportedByDeviceId: {type: string, description: 기존 연동 호환용 선택 필드}
        observedAt: {type: string, format: date-time}
        devices:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Device'}
    Device:
      type: object
      required: [vendorDeviceId, deviceType]
      properties:
        vendorDeviceId: {type: string, minLength: 1}
        deviceType: {type: string, minLength: 1}
        modelName: {type: [string, 'null']}
        firmwareVersion: {type: [string, 'null']}
        attributes: {type: object, additionalProperties: true}
    RegisterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            vendor: {type: string}
            registrationStatus: {type: string, enum: [MAPPED, PARTIALLY_MAPPED, UNMAPPED]}
            mappedDevices: {type: array, items: {type: object, additionalProperties: true}}
            unmappedDeviceIds: {type: array, items: {type: string}}
            checkedAt: {type: string, format: date-time}
    InvokeRequest:
      type: object
      required: [context, activePath, data]
      properties:
        payloadType: {type: string}
        context: {$ref: '#/components/schemas/Context'}
        relatedDeviceIds: {type: array, items: {type: string}}
        activePath: {type: array, items: {$ref: '#/components/schemas/PathHop'}}
        data: {type: object, additionalProperties: true}
    Context:
      type: object
      required: [eventExternalId, sourceSystem, occurredAt, sourceDeviceId]
      properties:
        eventExternalId: {type: string}
        sourceSystem: {type: string}
        occurredAt: {type: string, format: date-time}
        sentAt: {type: [string, 'null'], format: date-time}
        sourceDeviceId: {type: string, description: 원 신호를 최초 생성한 업체 장비번호}
        reportedByDeviceId: {type: string, description: HTTP 요청을 전송한 최종 장비·NMS 번호}
    PathHop:
      type: object
      required: [sequence, fromDeviceId, toDeviceId, medium, evidenceType, observations]
      properties:
        sequence: {type: integer, minimum: 1}
        fromDeviceId: {type: string}
        toDeviceId: {type: string}
        medium: {type: string}
        evidenceType: {type: string, enum: [OBSERVED, DECLARED, INFERRED, UNKNOWN]}
        observedAt: {type: [string, 'null'], format: date-time}
        status: {type: string, enum: [ACTIVE, DEGRADED, DOWN, UNKNOWN]}
        observations: {type: array, items: {$ref: '#/components/schemas/Observation'}}
        attributes: {type: object, additionalProperties: true}
    Observation:
      type: object
      required: [receivedAt]
      properties:
        receivedAt: {type: string, format: date-time}
        channel: {type: [string, 'null']}
        slot: {type: [integer, 'null']}
        rssiDbm: {type: [number, 'null']}
        snrDb: {type: [number, 'null']}
        selected: {type: boolean}
        attributes: {type: object, additionalProperties: true}
    InvokeResponse:
      type: object
      properties:
        data: {type: object, additionalProperties: true}
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
  responses:
    Error:
      description: 요청 처리 오류
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorBody'}}}
